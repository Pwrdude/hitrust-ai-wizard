<title>__PAGE_TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: assessor's field form. Sticky score bar, family rail on the left, one family of requirement cards at a time. */
:root {
  --bg: #f3f4f6;
  --surface: #ffffff;
  --sunken: #eceef2;
  --fg: #1b2230;
  --muted: #5b6474;
  --line: #d6dae2;
  --accent: #1f4b8f;
  --accent-soft: #e3ebf7;
  --met: #1d7a46;
  --met-soft: #e1f2e8;
  --notmet: #b3261e;
  --notmet-soft: #fbe5e3;
  --na: #6b6f7a;
  --na-soft: #ebecef;
  --warn: #8a5a00;
  --warn-soft: #fbf0d9;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161d; --surface: #1a1f28; --sunken: #222834; --fg: #e4e8ef; --muted: #9aa3b2; --line: #313847;
    --accent: #8fb2ec; --accent-soft: #233350; --met: #6fcf97; --met-soft: #183526; --notmet: #f28b82; --notmet-soft: #3d1f1d;
    --na: #a7abb5; --na-soft: #2a2e37; --warn: #e8bd6a; --warn-soft: #3a2e14; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161d; --surface: #1a1f28; --sunken: #222834; --fg: #e4e8ef; --muted: #9aa3b2; --line: #313847;
  --accent: #8fb2ec; --accent-soft: #233350; --met: #6fcf97; --met-soft: #183526; --notmet: #f28b82; --notmet-soft: #3d1f1d;
  --na: #a7abb5; --na-soft: #2a2e37; --warn: #e8bd6a; --warn-soft: #3a2e14; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Header */
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.head-in { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding-block: 12px; max-width: 1280px; margin: 0 auto; }
.ident { flex: 1 1 280px; min-width: 0; }
.ident h1 { font-size: 20px; font-weight: 600; line-height: 1.2; }
.ident p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; }
.stat { display: flex; flex-direction: column; }
.stat .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.stat .v { font-family: var(--font-mono); font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 12px; color: var(--muted); }
.save { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; min-width: 120px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--na); flex: none; }
.save[data-s="saved"] .dot { background: var(--met); }
.save[data-s="saving"] .dot { background: var(--warn); }
.save[data-s="error"] .dot { background: var(--notmet); }
.progress { height: 3px; background: var(--sunken); }
.progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
@media (prefers-reduced-motion: reduce) { .progress > i { transition: none; } }

.banner { max-width: 1280px; margin: 12px auto 0; }
.banner > div { background: var(--warn-soft); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; font-size: 13px; }

/* Shell */
.shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px; max-width: 1280px; margin: 0 auto; padding-block: 20px 64px; }
nav.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 92px); align-self: start; display: flex; flex-direction: column; gap: 2px; max-height: calc(100vh - 120px); overflow-y: auto; }
.rail button { all: unset; cursor: pointer; display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; padding: 7px 10px; border-radius: 6px; font-size: 13px; color: var(--fg); }
.rail button:hover { background: var(--sunken); }
.rail button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.rail button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.rail .code { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.rail button[aria-current="true"] .code { color: var(--accent); }
.rail .cnt { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rail .cnt.done { color: var(--met); }
.rail .sep { height: 1px; background: var(--line); margin: 6px 4px; }
.rail-select { display: none; }

main { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.section-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.section-head h2 { font-size: 24px; font-weight: 600; }
.section-head p { margin: 4px 0 0; color: var(--muted); max-width: 70ch; }
.filters { display: flex; gap: 4px; background: var(--sunken); padding: 3px; border-radius: 8px; }
.filters button { all: unset; cursor: pointer; padding: 5px 10px; border-radius: 6px; font-size: 12.5px; color: var(--muted); }
.filters button[aria-pressed="true"] { background: var(--surface); color: var(--fg); font-weight: 600; box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
.filters button:focus-visible { outline: 2px solid var(--accent); }

/* Requirement card */
.req { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.req[data-status="NOT MET"] { border-left: 4px solid var(--notmet); }
.req[data-status="MET"] { border-left: 4px solid var(--met); }
.req[data-status="N/A"] { border-left: 4px solid var(--na); }
.req-top { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: space-between; align-items: flex-start; padding: 14px 16px 10px; }
.req-title { min-width: 0; flex: 1 1 320px; }
.req-title .id { font-family: var(--font-mono); font-size: 12.5px; color: var(--accent); font-weight: 500; }
.req-title h3 { font-size: 17px; font-weight: 600; margin-top: 2px; }
.req-title blockquote { margin: 6px 0 0; color: var(--fg); max-width: 75ch; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--sunken); color: var(--muted); white-space: nowrap; font-weight: 500; }
.chip.pts { font-family: var(--font-mono); text-transform: none; letter-spacing: 0; }
.chip.block { background: var(--notmet-soft); color: var(--notmet); }
.chip.st-MET { background: var(--met-soft); color: var(--met); }
.chip.st-NOTMET { background: var(--notmet-soft); color: var(--notmet); }
.chip.st-NA { background: var(--na-soft); color: var(--na); }
.chip.st-OPEN { background: var(--sunken); color: var(--muted); }

.objs { border-top: 1px solid var(--line); }
.obj { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.obj:last-child { border-bottom: 0; }
.obj-q { min-width: 0; }
.obj-q .oid { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-right: 6px; }
.obj-q .kind { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-left: 6px; white-space: nowrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; align-self: start; }
.seg label { position: relative; cursor: pointer; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg span { display: block; padding: 5px 10px; font-size: 12px; font-weight: 600; color: var(--muted); border-left: 1px solid var(--line); white-space: nowrap; }
.seg label:first-child span { border-left: 0; }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: -2px; }
.seg input[value="MET"]:checked + span { background: var(--met-soft); color: var(--met); }
.seg input[value="NOT MET"]:checked + span { background: var(--notmet-soft); color: var(--notmet); }
.seg input[value="N/A"]:checked + span { background: var(--na-soft); color: var(--na); }
.seg input[value="NOT ASSESSED"]:checked + span { background: var(--sunken); color: var(--fg); }
.obj-fields { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px 12px; align-items: start; }
.methods { display: flex; gap: 10px; flex-wrap: wrap; padding-top: 6px; }
.methods label { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; color: var(--muted); cursor: pointer; white-space: nowrap; }

.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field > span { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 500; }
input[type="text"], input[type="number"], input[type="email"], textarea, select {
  font: inherit; font-size: 13.5px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; width: 100%; min-width: 0;
}
textarea { resize: vertical; min-height: 38px; line-height: 1.45; }
input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }

details.ssp { border-top: 1px solid var(--line); background: var(--sunken); }
details.ssp > summary { cursor: pointer; padding: 10px 16px; font-size: 13px; font-weight: 600; color: var(--fg); list-style: none; display: flex; gap: 8px; align-items: center; }
details.ssp > summary::-webkit-details-marker { display: none; }
details.ssp > summary::before { content: "▸"; color: var(--muted); font-size: 11px; transition: transform .15s; }
details.ssp[open] > summary::before { transform: rotate(90deg); }
details.ssp > summary .hint { font-weight: 400; color: var(--muted); font-size: 12px; }
.ssp-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; padding: 4px 16px 16px; }
.ssp-grid .wide { grid-column: 1 / -1; }
.prov { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 6px; }

/* Scope form */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.panel h3 { font-size: 16px; font-weight: 600; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 14px; }
.grid2 .wide, .grid3 .wide { grid-column: 1 / -1; }
.esp-table { width: 100%; border-collapse: collapse; }
.esp-wrap { overflow-x: auto; }
.esp-table th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 500; padding: 0 6px 4px 0; }
.esp-table td { padding: 3px 6px 3px 0; vertical-align: top; min-width: 120px; }
.btn { all: unset; cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--accent); padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.btn:hover { background: var(--accent-soft); }
.btn:focus-visible { outline: 2px solid var(--accent); }
.btn.quiet { color: var(--muted); font-weight: 500; }
.empty { color: var(--muted); font-size: 13px; padding: 24px; text-align: center; background: var(--surface); border: 1px dashed var(--line); border-radius: 8px; }
footer.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); font-size: 12px; }
footer.tools textarea { font-family: var(--font-mono); font-size: 11.5px; min-height: 120px; }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  nav.rail { display: none; }
  .rail-select { display: block; }
  .obj-fields { grid-template-columns: minmax(0, 1fr); }
  .ssp-grid, .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); }
  .stats { gap: 6px 14px; }
  .stat .v { font-size: 16px; }
}
@media (max-width: 520px) {
  .obj { grid-template-columns: minmax(0, 1fr); }
  .seg { width: 100%; }
  .seg label { flex: 1; text-align: center; }
  .seg span { padding: 6px 4px; font-size: 11px; }
}
/* HITRUST additions */
.chip.inh-Fully { background: var(--met-soft); color: var(--met); }
.chip.inh-Partially { background: var(--warn-soft); color: var(--warn); }
.chip.cap { background: var(--notmet-soft); color: var(--notmet); }
.chip.score { font-family: var(--font-mono); text-transform: none; letter-spacing: 0; background: var(--accent-soft); color: var(--accent); }
.req-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
.req-note { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; max-width: 75ch; }
.obj.na-tail { opacity: .62; }
.cov { display: flex; gap: 12px; flex-wrap: wrap; padding-top: 6px; }
.cov label { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; color: var(--fg); cursor: pointer; white-space: nowrap; font-weight: 500; }
.cov .divider { width: 1px; background: var(--line); align-self: stretch; }
.mat { border-top: 1px solid var(--line); padding: 12px 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 14px; align-items: end; }
.mat .field small { color: var(--muted); font-size: 11.5px; }
.mat .total { font-family: var(--font-mono); font-size: 20px; font-weight: 500; }
.mat .total small { font-size: 12px; color: var(--muted); }
.mat-head { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.mat-head h4 { margin: 0; font-family: var(--font-display); font-size: 14px; font-weight: 600; }
.mat-head span { font-size: 12px; color: var(--muted); }
.tail-q { display: flex; flex-direction: column; gap: 6px; }
.tail-q > span { font-size: 13px; font-weight: 600; }
.tail-q small { color: var(--muted); font-size: 12px; }
.checks { display: flex; flex-wrap: wrap; gap: 6px 16px; }
.checks label { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; cursor: pointer; }
.yn { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; width: max-content; }
.yn label { position: relative; cursor: pointer; }
.yn input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.yn span { display: block; padding: 4px 12px; font-size: 12.5px; font-weight: 600; color: var(--muted); border-left: 1px solid var(--line); }
.yn label:first-child span { border-left: 0; }
.yn input:checked + span { background: var(--accent-soft); color: var(--accent); }
.yn input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: -2px; }
.scope-sum { font-size: 13px; color: var(--fg); background: var(--accent-soft); border-radius: 6px; padding: 10px 12px; }
details.outlist { background: var(--surface); border: 1px dashed var(--line); border-radius: 8px; padding: 10px 14px; font-size: 13px; color: var(--muted); }
details.outlist summary { cursor: pointer; font-weight: 600; color: var(--fg); }
details.outlist li { margin: 4px 0; }
.verdict { font-size: 12.5px; color: var(--muted); margin: 0; }
</style>

<header>
  <div class="head-in gutter">
    <div class="ident">
      <h1 id="h-client"></h1>
      <p id="h-sub"></p>
    </div>
    <div class="stats">
      <div class="stat"><span class="k" id="s-score-k">AI score (provisional)</span><span class="v" id="s-score">— <small>/ 62</small></span></div>
      <div class="stat"><span class="k">Requirements</span><span class="v" id="s-req">0 <small>/ 0</small></span></div>
      <div class="stat"><span class="k">Elements</span><span class="v" id="s-el">0 <small>/ 0</small></span></div>
      <div class="stat"><span class="k">CAP candidates</span><span class="v" id="s-cap">0</span></div>
      <div class="save" id="save" data-s="idle" role="status" aria-live="polite"><span class="dot"></span><span id="save-t">Connecting…</span></div>
    </div>
  </div>
  <div class="progress"><i id="prog"></i></div>
</header>

<div class="banner gutter" id="banner" hidden><div id="banner-t"></div></div>

<div class="shell gutter">
  <nav class="rail" id="rail" aria-label="Sections"></nav>
  <main>
    <select class="rail-select" id="rail-select" aria-label="Section"></select>
    <p class="verdict" id="verdict"></p>
    <div id="view"></div>
    <footer class="tools">
      <button class="btn quiet" id="export-btn" type="button">Copy all answers as JSON</button>
      <span id="export-msg"></span>
      <textarea id="export-box" hidden readonly aria-label="Answers as JSON"></textarea>
    </footer>
  </main>
</div>

<script type="application/json" id="ai-data">__AI_DATA__</script>
<script>
(function () {
  "use strict";
  const DATA = JSON.parse(document.getElementById("ai-data").textContent);
  const REQS = DATA.requirements;
  const BY_ID = Object.fromEntries(REQS.map(r => [r.id, r]));
  const TOPICS = DATA.topics;
  const COND = DATA.cond_text, REQUIRES = DATA.requires_text;
  const RESULTS = ["MET", "NOT MET", "N/A", "NOT ASSESSED"];
  const METHODS = ["Examine", "Interview", "Test"];
  const LEVELS = ["policy", "procedure", "implemented", "measured", "managed"];
  const LNAME = { policy: "Policy", procedure: "Procedure", implemented: "Implemented", measured: "Measured", managed: "Managed" };
  const W = DATA.weights;
  const RATE = [[0, "NC"], [25, "SC"], [50, "PC"], [75, "MC"], [100, "FC"]];
  const ABBR = Object.fromEntries(RATE);
  const MODEL_TYPES = [["rule", "Rule-based (expert system)"], ["predictive", "Predictive (non-generative ML)"], ["generative", "Generative (foundation model)"]];
  const DRAFT_KEY = "hitrust-ai-q-draft:" + (DATA.meta.engagement_id || "x");

  // ---------- state ----------
  const state = { responses: {}, scope: blankScope() };
  let db = null, readOnly = false, ready = false, current = "SCOPE", filter = "all";
  const locked = () => readOnly || !ready;

  function blankTail() { return { model_types: [], q2: null, q3: null, rag: null, finetune: null, tools: null, external_models: null, model_builder: null }; }
  function blankScope() {
    return { level: "ai2", measured_managed: false, tailoring: blankTail(), description: "", deployment: "", boundary: "", ai_platforms: "", data_sources: "",
      end_users: "", privileged_users: "", diagram_reference: "", inventory_reference: "", system_owner: {}, ai_governance_lead: {}, security_officer: {},
      models: [], providers: [] };
  }
  function blankEl() { return { result: "NOT ASSESSED", policy: false, procedure: false, evidence: "", notes: "", methods: [] }; }
  function blankResp(rid) {
    const e = {}; BY_ID[rid].elements.forEach(x => { e[x.id] = blankEl(); });
    return { req: rid, elements: e, maturity: { policy: null, procedure: null, implemented: null, measured: null, managed: null }, scope_override: null,
      interviewees: "", implementation: "", planned_implementation: "", na_justification: "", responsible: "", provider: "Customer", evidence: "", notes: "", measured: "", managed: "" };
  }
  function resp(rid) { if (!state.responses[rid]) state.responses[rid] = blankResp(rid); return state.responses[rid]; }
  function merge(rid, body) {
    const out = Object.assign(blankResp(rid), body || {});
    out.elements = Object.assign(blankResp(rid).elements, (body && body.elements) || {});
    Object.keys(out.elements).forEach(k => { out.elements[k] = Object.assign(blankEl(), out.elements[k]); });
    out.maturity = Object.assign(blankResp(rid).maturity, (body && body.maturity) || {});
    return out;
  }
  function mergeScope(body) {
    const s = Object.assign(blankScope(), body || {});
    s.tailoring = Object.assign(blankTail(), (body && body.tailoring) || {});
    return s;
  }
  const T = () => state.scope.tailoring;
  const LEVEL = () => state.scope.level === "ai1" ? "ai1" : "ai2";
  const MM = () => LEVEL() === "ai2" && !!state.scope.measured_managed;
  const usedLevels = () => LEVEL() === "ai1" ? ["implemented"] : MM() ? LEVELS : ["policy", "procedure", "implemented"];

  // ---------- tailoring + scoring (mirrors hitrust_lib.py) ----------
  function inScope(rid) {
    const r = BY_ID[rid], ov = state.responses[rid] && state.responses[rid].scope_override;
    if (ov === "in") return [true, "included by assessor override"];
    if (ov === "out") return [false, "excluded by assessor override"];
    const t = T(), types = (t.model_types || []).filter(x => ["rule", "predictive", "generative"].includes(x));
    if (!types.length) return [true, "tailoring not answered"];
    const ap = r.applies;
    if (!types.some(x => ap.models.includes(x))) return [false, "model type not in scope (" + ap.models.join(", ") + " only)"];
    if (ap.trigger === "q2" && t.q2 === false) return [false, "Q2 answered no"];
    if (ap.trigger === "q3" && t.q3 === false) return [false, "Q3 answered no"];
    if (ap.trigger === "q2_or_q3" && t.q2 === false && t.q3 === false) return [false, "Q2 and Q3 both answered no"];

    const provSel = h("select", { id: "pk-" + slug(rid), disabled: locked() }, ...["Customer", "Shared", "Inherited"].map(k => h("option", { value: k, selected: provKind === k, disabled: k === "Inherited" && c.inheritance === "No", text: k === "Inherited" && c.inheritance === "No" ? "Inherited (not allowed)" : k })));

      MM() ? textField("Managed: how failures against the metric are corrected", "mg-" + slug(rid), r.managed, v => { r.managed = v; schedule(path, "managed"); }, { area: true, wide: true }) : null,

    if (ev.status !== "N/A") card.append(maturityBlock(rid));
    card.append(det);
    return card;
  }

  function maturityBlock(rid) {
    const r = resp(rid), e = evalReq(rid), path = "responses/" + rid;
    const wrap = h("div", { class: "mat" }, h("div", { class: "mat-head" }, h("h4", { text: "Maturity (" + LEVEL() + ")" }),
      h("span", { text: LEVEL() === "ai1" ? "ai1 scores Implemented only." : "Auto uses the element coverage: under 11% NC, 11–32 SC, 33–65 PC, 66–89 MC, 90+ FC. Override after judging strength." })));
    usedLevels().forEach(k => {
      const sug = e.sug ? e.sug[k] : null;
      const covTxt = e.cov && e.cov[k] != null ? e.cov[k] + "% of elements" : k === "implemented" ? "finish the elements" : "rate it yourself";
      const sel = h("select", { id: "mt-" + k + "-" + slug(rid), disabled: locked() },
        h("option", { value: "", text: "Auto" + (sug != null ? " (" + fmtLv(sug) + ")" : "") }),
        ...RATE.map(([v, a]) => h("option", { value: String(v), selected: r.maturity[k] === v, text: a + " " + v })));
      sel.addEventListener("change", () => { r.maturity[k] = sel.value === "" ? null : +sel.value; schedule(path, "maturity", k); refreshCard(rid); });

    return wrap;
  }

  function scopeView() {
    const s = state.scope, path = "scope/system", t = s.tailoring;

    const setIn = (o, k) => v => { s[o] = Object.assign({}, s[o] || {}); s[o][k] = v; schedule(path, o, k); };
    const setT = (k, v) => { t[k] = v; schedule(path, "tailoring", k); updateStats(); renderSum(); };

      h("p", { text: "Answer the MyCSF \"Security for AI Systems\" questions first. They decide which of the 44 AI requirements apply; the system characteristics below decide which evaluative elements are N/A." }))));

      return h("div", { class: "tail-q" }, h("span", { text: label }), hint ? h("small", { text: hint }) : null,
        h("div", { class: "yn", role: "radiogroup", "aria-label": label }, ...[[true, "Yes"], [false, "No"], [null, "Not sure"]].map(([v, l]) =>
          h("label", {}, h("input", { type: "radio", name: nm, checked: t[k] === v, disabled: locked(), onchange: () => setT(k, v) }), h("span", { text: l })))));
    };
    const sum = h("div", { class: "scope-sum" });
    function renderSum() {
      const ins = REQS.filter(r => inScope(r.id)[0]).length;
      const na = REQS.filter(r => { const e = evalReq(r.id); return e.in_scope && e.status === "N/A"; }).length;
      sum.textContent = !(t.model_types || []).length ? "Pick at least one AI model type." :
        ins + " of 44 AI requirements apply" + (na ? " (" + na + " of them N/A for this system)" : "") + ". Check this against the requirement count in the client's MyCSF object; use a requirement's Scope setting where they differ.";
    }
    const levelSel = h("div", { class: "yn", role: "radiogroup", "aria-label": "Certification" }, ...[["ai2", "ai2 (with r2)"], ["ai1", "ai1 (with e1/i1)"]].map(([v, l]) =>
      h("label", {}, h("input", { type: "radio", name: "lvl", checked: s.level === v, disabled: locked(), onchange: () => { s.level = v; if (v === "ai1") s.measured_managed = false; schedule(path, "level"); schedule(path, "measured_managed"); updateStats(); render(); } }), h("span", { text: l }))));
    const mm = h("label", {}, h("input", { type: "checkbox", checked: !!s.measured_managed, disabled: locked() || s.level === "ai1", onchange: e => { s.measured_managed = e.target.checked; schedule(path, "measured_managed"); updateStats(); } }), "Score Measured and Managed (optional for r2; without them a requirement tops out at 75)");

    wrap.append(h("div", { class: "panel" }, h("h3", { text: "Certification and tailoring" }),
      h("div", { class: "tail-q" }, h("span", { text: "Target certification" }), levelSel, h("div", { class: "checks" }, mm)),
      h("div", { class: "tail-q" }, h("span", { text: "Q1. What types of AI models does the in-scope system use?" }), h("small", { text: "Select every type in use across all in-scope models." }),
        h("div", { class: "checks" }, ...MODEL_TYPES.map(([v, l]) => h("label", {}, h("input", { type: "checkbox", checked: (t.model_types || []).includes(v), disabled: locked(), onchange: e => {
          const cur = new Set(t.model_types || []); e.target.checked ? cur.add(v) : cur.delete(v); setT("model_types", ["rule", "predictive", "generative"].filter(x => cur.has(x)));
        } }), l)))),
      yn("q2", "Q2. Was confidential or covered data used to train or tune a model, or to enhance prompts through RAG?", "High-water mark: yes if any in-scope model qualifies."),
      yn("q3", "Q3. Are any models' architecture and parameters confidential to the organization?", "High-water mark across models."),
      h("h3", { text: "System characteristics" }),
      h("div", { class: "grid2" }, yn("rag", "Uses retrieval-augmented generation (RAG) or embeddings"), yn("finetune", "Fine-tunes models"),
        yn("tools", "Uses agents, plugins or other language model tools"), yn("external_models", "Uses externally sourced models (third-party / open-weight)"),
        yn("model_builder", "Builds and trains its own models")),
      sum));
    renderSum();

    wrap.append(h("div", { class: "panel" }, h("h3", { text: "AI system" }), h("div", { class: "grid2" },
      textField("System description", "sc-desc", s.description, set("description"), { area: true, rows: 3, wide: true, ph: "What the AI system does, for whom, and the decisions or actions it supports" }),
      textField("Deployment and architecture", "sc-dep", s.deployment, set("deployment"), { area: true, rows: 3, wide: true, ph: "Hosting, AI platform, application layer, where prompts and outputs flow" }),
      textField("Boundary", "sc-bound", s.boundary, set("boundary"), { area: true, rows: 3, wide: true, ph: "In-scope platforms marked as featuring AI in MyCSF; what is out and how it is separated" }),
      textField("AI platforms", "sc-plat", s.ai_platforms, set("ai_platforms"), { wide: true, ph: "e.g. Azure AI Foundry, AWS Bedrock, Databricks, self-hosted GPU cluster" }),
      textField("Data sources (training, tuning, RAG)", "sc-data", s.data_sources, set("data_sources"), { area: true, wide: true, ph: "Sources, sensitivity (PHI, PII, confidential), how data reaches the model" }),
      textField("End users", "sc-eu", s.end_users, set("end_users"), { type: "number" }),

      const p = s[k] || {};
      people.append(h("div", { class: "grid3" }, textField(l + " name", "sc-" + k + "-n", p.name, setIn(k, "name")),
        textField("Title", "sc-" + k + "-t", p.title, setIn(k, "title")), textField("Email", "sc-" + k + "-e", p.email, setIn(k, "email"), { type: "email" })));
    });
    wrap.append(people);
    wrap.append(tablePanel("Models in scope", "models", [["name", "Model"], ["version", "Version"], ["type", "Type"], ["source", "Internal / external"], ["provider", "Provider"], ["owner", "Owner"]], "Add model"));
    wrap.append(tablePanel("AI service providers", "providers", [["name", "Provider"], ["service", "Service"], ["role", "Role (platform, model creator, app)"], ["hitrust", "HITRUST cert / inheritance"], ["srm", "Shared responsibility matrix"]], "Add provider"));
    return wrap;
  }
  function tablePanel(title, key, cols, addLabel) {
    const s = state.scope, path = "scope/system";
    const panel = h("div", { class: "panel" }, h("h3", { text: title }));

        rows.append(h("tr", {}, ...cols.map(([k]) => { const inp = h("input", { type: "text", id: key + "-" + i + "-" + k, disabled: locked(), "aria-label": k }); inp.value = p[k] || ""; inp.addEventListener("input", () => { p[k] = inp.value; schedule(path, key); }); return h("td", {}, inp); }),
          h("td", {}, h("button", { class: "btn quiet", type: "button", disabled: locked(), onclick: () => { s[key].splice(i, 1); schedule(path, key); redraw(); } }, "Remove"))));

      h("div", {}, h("button", { class: "btn", type: "button", disabled: locked(), onclick: () => { s[key] = (s[key] || []).concat([Object.fromEntries(cols.map(([k]) => [k, ""]))]); schedule(path, key); redraw(); } }, addLabel)));
    return panel;
  }

  const stale = new Set();
  document.addEventListener("focusout", () => setTimeout(() => {
    flushAll();
    const active = document.activeElement;
    stale.forEach(key => {
      if (key === "VIEW") { if (!(active && document.getElementById("view").contains(active))) { stale.delete(key); render(); } return; }
      const card = document.querySelector('.req[data-rid="' + key + '"]');
      if (!card) { stale.delete(key); return; }
      if (!(active && card.contains(active)) && !dirty["responses/" + key]) { stale.delete(key); card.replaceWith(reqCard(key)); }
    });
  }, 0));

  document.getElementById("export-btn").addEventListener("click", async () => {
    const box = document.getElementById("export-box");
    const text = JSON.stringify({ format: "hitrust-ai-questionnaire/1", engagement_id: DATA.meta.engagement_id, responses: state.responses, scope: state.scope }, null, 1);
    box.value = text;
    try { await navigator.clipboard.writeText(text); document.getElementById("export-msg").textContent = "Copied. Paste it into the chat to import."; box.hidden = true; }
    catch (e) { box.hidden = false; box.focus(); box.select(); document.getElementById("export-msg").textContent = "Copy the selected text and paste it into the chat."; }
  });

  document.getElementById("h-client").textContent = DATA.meta.client + " · " + DATA.meta.system;
  document.getElementById("h-sub").textContent = [DATA.meta.assessment_type, "Assessor: " + DATA.meta.assessor, "HITRUST AI Security Assessment"].filter(Boolean).join(" · ");
  try { const v = localStorage.getItem(DRAFT_KEY + ":view"); if (v && (v === "SCOPE" || v === "CAP" || TOPICS.find(t => t.code === v))) current = v; } catch (e) { /* ignore */ }
  renderRail();
